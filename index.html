
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submission Tester</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#f5f6f8;font-family:Arial,sans-serif;
  color:#222;padding:18px
}
.card{
  width:100%;max-width:360px;background:white;padding:24px;
  border-radius:14px;box-shadow:0 5px 25px #0000000a
}
h2{margin:0 0 6px;font-size:21px}
p{color:#888;font-size:13px;margin:0 0 22px}
input,textarea{
  width:100%;padding:12px;margin-bottom:12px;
  border:1px solid #e5e5e5;border-radius:8px;
  font:14px Arial;outline:none
}
input:focus,textarea:focus{border-color:#777}
textarea{height:90px;resize:vertical}
button{
  width:100%;padding:13px;border:0;border-radius:8px;
  background:#222;color:white;font-size:14px;cursor:pointer
}
button:disabled{opacity:.5;cursor:wait}
#status{font-size:13px;margin-top:14px;text-align:center}
</style>
</head>

<body>

<div class="card">
  <h2>Contact Us</h2>
  <p>Send us your details.</p>

  <form id="form" method="POST" target="submitFrame">

    <input name="name" placeholder="Your name" required>

    <input name="whatsapp" type="tel"
      placeholder="WhatsApp number" required>

    <textarea name="description"
      placeholder="Write your message..." required></textarea>

    <button id="send" type="submit">Send Message</button>
  </form>

  <iframe name="submitFrame" hidden></iframe>

  <div id="status" role="status"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwQtWhgX6LIbm7gsHux8eqNVk2I3h2G-ileOS_UgEQZtUruEqw0s7JcfLjnR-jkU3E/exec";

const form = document.getElementById("form");
const frame = document.querySelector('iframe[name="submitFrame"]');
const button = document.getElementById("send");
const status = document.getElementById("status");

form.action = SCRIPT_URL;

let submitted = false;

frame.addEventListener("load", () => {
  if (!submitted) return;

  submitted = false;
  button.disabled = false;
  button.textContent = "Send Message";

  status.textContent =
    "Request completed. Check your Google Sheet.";

  form.reset();
});

form.addEventListener("submit", () => {
  submitted = true;
  button.disabled = true;
  button.textContent = "Sending...";
  status.textContent = "Submitting your details...";
});
</script>

</body>
</html>
