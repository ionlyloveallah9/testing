<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Submission Tester</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#f5f6f8;font-family:Arial,sans-serif;
  color:#222;padding:18px
}
.card{
  width:100%;max-width:360px;background:white;
  padding:24px;border-radius:14px;
  box-shadow:0 5px 25px #0000000a
}
h2{margin:0 0 6px;font-size:21px}
p{color:#888;font-size:13px;margin:0 0 22px}
input,textarea{
  width:100%;padding:12px;margin-bottom:12px;
  border:1px solid #e5e5e5;border-radius:8px;
  font:14px Arial;outline:none
}
input:focus,textarea:focus{border-color:#777}
textarea{height:90px;resize:vertical}
button{
  width:100%;padding:13px;border:0;border-radius:8px;
  background:#222;color:white;font-size:14px;cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
#status{font-size:13px;margin-top:14px;text-align:center}
#status.success{color:#168344}
#status.error{color:#d32f2f}
</style>
</head>

<body>
<div class="card">
  <h2>Contact Us</h2>
  <p>Send us your details.</p>

  <form id="form" method="POST" target="submitFrame">
    <input name="name" placeholder="Your name" required>
    <input name="whatsapp" placeholder="WhatsApp number" type="tel" required>
    <textarea name="description" placeholder="Write your message..." required></textarea>
    <input type="hidden" name="requestId">
    <button id="send" type="submit">Send Message</button>
  </form>

  <iframe name="submitFrame" id="submitFrame" hidden></iframe>
  <div id="status" role="status" aria-live="polite"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyw-ZrqwYjep4dEClLhLD5cObCgm0AwVyFZxXRLVcgXs99UoTjlHRgX5dSi2jqtnUJK/exec";

const form = document.getElementById("form");
const button = document.getElementById("send");
const status = document.getElementById("status");
const requestInput = form.querySelector('[name="requestId"]');

form.action = SCRIPT_URL;

let activeRequest = null;
let timeoutId = null;

form.addEventListener("submit", () => {
  const requestId = crypto.randomUUID();

  activeRequest = requestId;
  requestInput.value = requestId;

  button.disabled = true;
  button.textContent = "Sending...";
  status.className = "";
  status.textContent = "Submitting your details...";

  clearTimeout(timeoutId);

  timeoutId = setTimeout(() => {
    if (activeRequest !== requestId) return;

    activeRequest = null;
    button.disabled = false;
    button.textContent = "Send Message";
    status.className = "error";
    status.textContent = "No confirmation received. Check your Google Sheet before trying again.";
  }, 30000);
});

window.addEventListener("message", (event) => {
  const data = event.data;

  if (
    !data ||
    data.type !== "WIFI_SHARE_SUBMISSION" ||
    data.requestId !== activeRequest
  ) return;

  clearTimeout(timeoutId);
  activeRequest = null;

  button.disabled = false;
  button.textContent = "Send Message";

  if (data.success) {
    status.className = "success";
    status.textContent = data.message;
    form.reset();
  } else {
    status.className = "error";
    status.textContent = data.message || "Submission failed.";
  }
});
</script>
</body>
</html>
